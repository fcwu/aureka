name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history so --generate-notes can diff tags

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # Use the annotated tag body when it has substantial release notes
          # (more than just the commit subject + Co-Authored-By). Otherwise
          # let GitHub auto-generate notes from commits since the previous tag.
          body=$(git tag -l "$tag" --format='%(contents)' | sed '/^Co-Authored-By:/d' | sed '/^$/d')
          line_count=$(echo "$body" | wc -l)
          if [ "$line_count" -gt 3 ]; then
            gh release create "$tag" --title "$tag" --notes-from-tag
          else
            gh release create "$tag" --title "$tag" --generate-notes
          fi
